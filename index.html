    <style>
      :root {
        --bg-canvas: #faf8f5;
        --bg-card: #ffffff;
        --bg-subtle: #f3efe8;
        --border-color: #e6e1d8;
        --text-primary: #1f242d;
        --text-secondary: #5f6672;
        --accent-navy: #2b4c7e;
        --accent-navy-hover: #223d66;
        --accent-amber: #c87d28;
        --accent-amber-hover: #b06c20;
        --accent-amber-text: #8f5312;
        --accent-green: #2f7d5b;
        --accent-red: #c84b4b;
        --accent-red-hover: #b23d3d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        font-family: "Plus Jakarta Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      .mono-num {
        font-family: "IBM Plex Mono", "Noto Sans KR", monospace;
        font-variant-numeric: tabular-nums;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Header */
      .top-header {
        position: sticky;
        top: 0;
        z-index: 30;
        height: 60px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border-color);
      }

      .header-inner {
        max-width: 1152px;
        height: 100%;
        margin: 0 auto;
        padding: 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-btn {
        background: none;
        border: none;
        padding: 4px 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .desktop-nav {
        display: none;
        align-items: center;
        gap: 24px;
      }

      .nav-link {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 6px 2px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease, border-color 0.15s ease;
      }

      .nav-link:hover {
        color: var(--text-primary);
      }

      .nav-link.active {
        color: var(--accent-navy);
        font-weight: 600;
        border-bottom-color: var(--accent-navy);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .icon-btn {
        min-height: 40px;
        padding: 6px 12px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: #ffffff;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        white-space: nowrap;
        text-decoration: none;
        transition: all 0.15s ease;
      }

      .icon-btn:hover {
        color: var(--text-primary);
        background: var(--bg-canvas);
      }

      .icon-btn.active {
        background: var(--accent-navy);
        border-color: var(--accent-navy);
        color: #ffffff;
      }

      .icon-btn.tint {
        color: var(--accent-navy);
        background: rgba(43, 76, 126, 0.08);
        border-color: rgba(43, 76, 126, 0.25);
      }

      .icon-btn.tint:hover {
        background: var(--accent-navy);
        color: #ffffff;
      }

      /* Demo Date Banner */
      .demo-banner {
        background: rgba(200, 125, 40, 0.12);
        border-bottom: 1px solid rgba(200, 125, 40, 0.3);
        padding: 8px 16px;
        text-align: center;
        font-size: 12px;
        color: var(--accent-amber-text);
      }

      .demo-reset-link {
        background: none;
        border: none;
        margin-left: 10px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-amber-text);
        text-decoration: underline;
        cursor: pointer;
      }

      /* Main Content */
      .main-content {
        flex: 1;
        width: 100%;
        max-width: 1152px;
        margin: 0 auto;
        padding: 24px 16px 92px;
      }

      /* Layout Grid */
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        align-items: start;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 20px;
      }

      .card-subtle {
        background: var(--bg-canvas);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 16px;
      }

      .section-header {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border-color);
      }

      h1.page-title {
        margin: 4px 0 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      h2.section-title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .muted {
        color: var(--text-secondary);
      }

      .small-text {
        font-size: 12px;
      }

      .body-text {
        font-size: 14px;
      }

      /* Buttons */
      .btn {
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 12px;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
        text-decoration: none;
        transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--accent-navy);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-navy-hover);
      }

      .btn-amber {
        background: var(--accent-amber);
        color: #ffffff;
      }

      .btn-amber:hover:not(:disabled) {
        background: var(--accent-amber-hover);
      }

      .btn-green {
        background: var(--accent-green);
        color: #ffffff;
      }

      .btn-green:hover:not(:disabled) {
        background: #26674b;
      }

      .btn-danger {
        background: var(--accent-red);
        color: #ffffff;
      }

      .btn-danger:hover:not(:disabled) {
        background: var(--accent-red-hover);
      }

      .btn-outline {
        background: var(--bg-canvas);
        border-color: var(--border-color);
        color: var(--text-primary);
      }

      .btn-outline:hover:not(:disabled) {
        background: var(--bg-subtle);
      }

      .btn-danger-outline {
        background: #ffffff;
        border-color: rgba(200, 75, 75, 0.45);
        color: var(--accent-red);
      }

      .btn-danger-outline:hover:not(:disabled) {
        background: rgba(200, 75, 75, 0.08);
      }

      .btn-sm {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 12px;
        border-radius: 10px;
      }

      .full-width {
        width: 100%;
      }

      /* Lists & Dividers */
      .divide-list > * + * {
        border-top: 1px solid var(--border-color);
      }

      .due-item {
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .due-item:first-child {
        padding-top: 4px;
      }

      .due-item:last-child {
        padding-bottom: 0;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .subject-label {
        font-weight: 700;
        color: var(--accent-navy);
      }

      .overdue-label {
        font-weight: 600;
        color: var(--accent-amber);
      }

      .mastered-label {
        font-weight: 600;
        color: var(--accent-green);
      }

      .topic-title {
        margin: 4px 0 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      /* Stats Grid */
      .stats-two {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 12px;
      }

      .stat-value {
        margin: 4px 0 0;
        font-size: 24px;
        font-weight: 700;
      }

      /* Form Inputs */
      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .input,
      .textarea,
      .select {
        width: 100%;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: var(--bg-canvas);
        color: var(--text-primary);
        padding: 11px 14px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }

      .input:focus,
      .textarea:focus,
      .select:focus {
        border-color: var(--accent-navy);
        background: #ffffff;
      }

      .textarea {
        resize: vertical;
        min-height: 76px;
      }

      .subject-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .subject-btn {
        min-height: 42px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .subject-btn.selected {
        background: var(--accent-navy);
        border-color: var(--accent-navy);
        color: #ffffff;
        font-weight: 600;
      }

      /* Alerts & Notices */
      .alert {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid;
        font-size: 13px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .alert-success {
        background: rgba(47, 125, 91, 0.08);
        border-color: rgba(47, 125, 91, 0.3);
        color: #215b42;
      }

      .alert-error {
        background: rgba(200, 75, 75, 0.08);
        border-color: rgba(200, 75, 75, 0.3);
        color: #9e2f2f;
      }

      .alert-warn {
        background: rgba(200, 125, 40, 0.1);
        border-color: rgba(200, 125, 40, 0.3);
        color: var(--accent-amber-text);
      }

      .alert-info {
        background: rgba(43, 76, 126, 0.07);
        border-color: rgba(43, 76, 126, 0.25);
        color: var(--accent-navy);
      }

      /* Correction & Analysis Items */
      .analysis-list {
        margin: 8px 0 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }

      .correction-box {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-canvas);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }

      .confidence-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
      }

      .confidence-sure {
        background: rgba(47, 125, 91, 0.12);
        color: var(--accent-green);
      }

      .confidence-check {
        background: rgba(200, 125, 40, 0.15);
        color: var(--accent-amber-text);
      }

      /* Filter Tabs */
      .filter-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .filter-tab {
        min-height: 38px;
        padding: 6px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: #ffffff;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .filter-tab.active {
        background: var(--accent-navy);
        border-color: var(--accent-navy);
        color: #ffffff;
        font-weight: 600;
      }

      /* Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(31, 36, 45, 0.48);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
      }

      .modal-panel {
        width: 100%;
        max-width: 680px;
        max-height: 90vh;
        overflow-y: auto;
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        box-shadow: 0 24px 48px rgba(31, 36, 45, 0.16);
      }

      .choice-option {
        width: 100%;
        min-height: 46px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--bg-canvas);
        color: var(--text-primary);
        text-align: left;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.15s ease;
      }

      .choice-option.selected {
        background: rgba(43, 76, 126, 0.1);
        border-color: var(--accent-navy);
        color: var(--accent-navy);
        font-weight: 600;
      }

      /* Mobile Bottom Nav */
      .mobile-nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        height: 64px;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
        border-top: 1px solid var(--border-color);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }

      .mobile-nav-btn {
        background: none;
        border: none;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
      }

      .mobile-nav-btn.active {
        color: var(--accent-navy);
        font-weight: 700;
      }

      .empty-state {
        text-align: center;
        padding: 36px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .empty-circle {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: rgba(47, 125, 91, 0.12);
        color: var(--accent-green);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .progress-bar-track {
        height: 8px;
        border-radius: 999px;
        background: var(--bg-subtle);
        overflow: hidden;
      }

      .progress-bar-fill {
        height: 100%;
        border-radius: 999px;
        background: var(--accent-navy);
      }

      .stack-sm {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .stack-md {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .stack-lg {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .row-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .row-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 640px) {
        .card {
          padding: 24px;
        }
        .section-header {
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;
        }
        .due-item {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
        .row-actions {
          flex-direction: row;
        }
        h1.page-title {
          font-size: 28px;
        }
      }

      @media (min-width: 768px) {
        .top-header {
          height: 64px;
        }
        .header-inner {
          padding: 0 24px;
        }
        .desktop-nav {
          display: flex;
        }
        .mobile-nav {
          display: none;
        }
        .main-content {
          padding: 32px 24px 48px;
        }
      }

      @media (min-width: 1024px) {
        .dashboard-grid {
          grid-template-columns: 8fr 4fr;
        }
      }

      @media (max-width: 480px) {
        .subject-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>

        }

          var dt = parseLocalDate(dateStr);
          dt.setDate(dt.getDate() + days);
          var y = dt.getFullYear();
          var m = String(dt.getMonth() + 1).padStart(2, "0");
          var d = String(dt.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + d;

          return capsules
            .filter(function (c) {
              return !c.isMastered && diffDays(c.nextReviewDate, todayStr) >= 0;
            })
            .map(function (c) {
              var overdueDays = Math.max(0, diffDays(c.nextReviewDate, todayStr));
              var adjustedForLongOverdue = overdueDays >= 14 && c.stage > 0;
              var effectiveStage = adjustedForLongOverdue ? Math.max(0, c.stage - 1) : c.stage;
              return {
                capsule: c,
                overdueDays: overdueDays,
                effectiveStage: effectiveStage,
                adjustedForLongOverdue: adjustedForLongOverdue,
              };

            .sort(function (a, b) {

                stage: 4,
                isMastered: true,
                nextReviewDate: todayStr,

            var interval = STAGE_INTERVALS[nextStage] || 30;
            return Object.assign({}, capsule, {
              stage: nextStage,
              isMastered: false,
              nextReviewDate: addDays(todayStr, interval),

            return Object.assign({}, capsule, {
              stage: baseStage,
              isMastered: false,
              nextReviewDate: addDays(todayStr, 1),
            });
          }

            stage: 0,
            isMastered: false,
            nextReviewDate: addDays(todayStr, 1),
          });
        }

            대한: true,
            경우: true,
            것이다: true,
            때문: true,
            한다며: true,
          };
          var tokens = String(text || "")
            .replace(/[^\w가-힣\s]/g, " ")
            .split(/\s+/)
            .map(function (t) {
              return t.trim();
            })
            .filter(function (t) {
              return t.length >= 2 && !stopWords[t];
            });
          var seen = {};
          var unique = [];
          for (var i = 0; i < tokens.length; i++) {
            var k = tokens[i];
            if (!seen[k]) {
              seen[k] = true;
              unique.push(k);
            }
          }
          return unique;
        }

        function localAnalyze(subject, topic, lines) {
          var joined = lines.join(" ");
          var keywords = extractKeywords(topic + " " + joined).slice(0, 4);
          var keyConcepts = keywords.length >= 2
            ? keywords.slice(0, 3)
            : [topic + " 핵심 원리", subject + " 주요 개념", "정의와 적용 조건"];

          var confusingPoints = [
            "'" + topic + "'에서 용어의 정확한 정의와 예외 조건을 혼동하지 않도록 주의하세요.",
          ];
          if (lines[1]) {
            confusingPoints.push("두 번째 줄의 핵심 관계(" + lines[1].slice(0, 28) + (lines[1].length > 28 ? "..." : "") + ")를 예시와 함께 다시 확인하세요.");
          }

          var corrections = [];
          if (/무조건|항상|절대|모두\s/.test(joined)) {
            corrections.push({
              original: lines.find(function (l) {
                return /무조건|항상|절대|모두\s/.test(l);
              }) || lines[0],
              corrected: "일반적인 규칙이더라도 교과서 상 예외 조건이 있는지 함께 확인해 주세요.",
              reason: "'항상·무조건'처럼 단정적인 표현은 예외 사례에서 오답으로 이어질 수 있습니다.",
              confidence: "교과서 확인 권장",
            });
          }

          return {
            keyConcepts: keyConcepts,
            confusingPoints: confusingPoints,
            corrections: corrections,
            mode: "local",
          };
        }

        function localGenerateQuiz(capsule) {
          var line0 = capsule.lines[0] || capsule.topic;
          var line1 = capsule.lines[1] || capsule.lines[0] || capsule.topic;
          var line2 = capsule.lines[2] || capsule.lines[1] || capsule.topic;
          var concepts = (capsule.aiAnalysis && capsule.aiAnalysis.keyConcepts) || [capsule.topic];
          var kw = extractKeywords(line1 + " " + line0);
          var blankWord = concepts[0] && concepts[0].length <= 12 ? concepts[0] : kw[0] || capsule.topic;
          var blankSentence = line1.indexOf(blankWord) !== -1
            ? line1.replace(blankWord, "____")
            : "'" + capsule.topic + "'에서 핵심이 되는 개념은 ____이다.";

          var mcQuestion =
            "[" +
            capsule.subject +
            "] '" +
            capsule.topic +
            "'에 대한 설명으로 가장 알맞은 것은?";
          var correctOpt = line0;
          var wrong1 = "'" + capsule.topic + "'은(는) 다른 개념과 전혀 관계없이 단독으로만 쓰인다.";
          var wrong2 = "학습한 내용과 반대로 조건이 바뀌어도 결과는 항상 동일하다.";
          var wrong3 = "이 개념은 예외 없이 모든 상황에 동일하게 적용된다.";
          var options = [correctOpt, wrong1, wrong2, wrong3];
          // Deterministic shuffle based on capsule.id + minute so it varies
          var shift = (capsule.reviewHistory.length + new Date().getSeconds()) % 4;
          var rotated = [];
          for (var i = 0; i < 4; i++) {
            rotated.push(options[(i + shift) % 4]);
          }
          var answerIdx = rotated.indexOf(correctOpt);

          return {
            questions: [
              {
                id: "q1",
                type: "multiple_choice",
                question: mcQuestion,
                options: rotated,
                correctOptionIndex: answerIdx,
                answerKey: correctOpt,
                explanation: "정리한 핵심 내용: " + line0,
              },
              {
                id: "q2",
                type: "fill_blank",
                question: "다음 빈칸에 들어갈 알맞은 말을 적어보세요.\n" + blankSentence,
                answerKey: blankWord,
                explanation: "핵심 개념 키워드는 '" + blankWord + "'입니다.",
              },
              {
                id: "q3",
                type: "short_essay",
                question: "'" + capsule.topic + "'의 핵심 원리나 주의할 점을 한 문장으로 설명해보세요.",
                answerKey: line2,
                explanation: "모범 요지: " + line2,
              },
            ],
            mode: "local",
          };
        }

        function localGradeAnswer(question, userAnswer) {
          var ans = String(userAnswer || "").trim();
          var key = String(question.answerKey || "").trim();
          if (!ans) {
            return {
              result: "incorrect",
              feedback: "답안이 입력되지 않았습니다. 핵심 개념을 다시 확인해 보세요.",
            };
          }

          if (question.type === "fill_blank") {
            var normAns = ans.replace(/\s+/g, "").toLowerCase();
            var normKey = key.replace(/\s+/g, "").toLowerCase();
            if (normAns === normKey || normKey.indexOf(normAns) !== -1 && normAns.length >= 2 || normAns.indexOf(normKey) !== -1) {
              return {
                result: "correct",
                feedback: "핵심 용어 '" + key + "'을(를) 정확히 맞혔습니다.",
              };
            }
            return {
              result: "incorrect",
              feedback: "아쉽습니다. 빈칸에 알맞은 핵심 개념은 '" + key + "'입니다.",
            };
          }

          var keyWords = extractKeywords(key);
          var ansWords = extractKeywords(ans);
          var matched = 0;
          for (var i = 0; i < keyWords.length; i++) {
            if (ans.toLowerCase().indexOf(keyWords[i].toLowerCase()) !== -1) {
              matched++;
            }
          }
          var ratio = keyWords.length > 0 ? matched / keyWords.length : 0;

          if (ratio >= 0.45 || (ansWords.length >= 3 && matched >= 2)) {
            return {
              result: "correct",
              feedback: "핵심 개념을 자신의 문장으로 잘 설명했습니다.",
            };
          }
          if (matched >= 1 || ans.length >= 10) {
            return {
              result: "partial",
              feedback: "방향은 맞지만 핵심 키워드('" + keyWords.slice(0, 2).join(", ") + "')를 함께 포함하면 더 완벽합니다.",
            };
          }
          return {
            result: "incorrect",
            feedback: "핵심 내용과 거리가 있습니다. 해설을 확인하고 내일 다시 복습해 보세요.",
          };
        }

        function localWeeklyReport(capsules, todayStr) {
          var weekAgo = addDays(todayStr, -7);
          var recent = [];
          for (var i = 0; i < capsules.length; i++) {
            var c = capsules[i];
            for (var j = 0; j < c.reviewHistory.length; j++) {
              var h = c.reviewHistory[j];
              if (diffDays(weekAgo, h.date) >= 0) {
                recent.push({ subject: c.subject, h: h });
              }
            }
          }

          var subjStats = {};
          var typeStats = {};
          for (var k = 0; k < recent.length; k++) {
            var item = recent[k];
            if (!subjStats[item.subject]) subjStats[item.subject] = { total: 0, miss: 0 };
            subjStats[item.subject].total++;
            if (item.h.result !== "correct") subjStats[item.subject].miss++;

            var tLabel = QUESTION_TYPE_LABELS[item.h.questionType] || item.h.questionType;
            if (!typeStats[tLabel]) typeStats[tLabel] = { total: 0, miss: 0 };
            typeStats[tLabel].total++;
            if (item.h.result !== "correct") typeStats[tLabel].miss++;
          }

          var weakestSubject = "아직 충분한 기록 없음";
          var worstRate = -1;
          Object.keys(subjStats).forEach(function (subj) {
            var st = subjStats[subj];
            var rate = st.miss / st.total;
            if (rate > worstRate) {
              worstRate = rate;
              weakestSubject = subj;
            }
          });

          var weakestType = "아직 충분한 기록 없음";
          var worstTypeRate = -1;
          Object.keys(typeStats).forEach(function (t) {
            var st = typeStats[t];
            var rate = st.miss / st.total;
            if (rate > worstTypeRate) {
              worstTypeRate = rate;
              weakestType = t;
            }
          });

          return {
            weakestSubject: weakestSubject,
            weakestQuestionType: weakestType,
            patternSummary:
              "최근 7일간 총 " +
              recent.length +
              "회 복습을 완료했습니다. " +
              (weakestSubject !== "아직 충분한 기록 없음"
                ? "'" + weakestSubject + "' 과목과 '" + weakestType + "' 문제에서 오답·부분 정답 비율이 상대적으로 높게 나타났습니다."
                : "아직 복습 데이터가 적어 정확한 취약 패턴을 분석하려면 퀴즈 복습을 2~3회 이상 진행해 주세요."),
            recommendations: [
              weakestSubject !== "아직 충분한 기록 없음"
                ? weakestSubject + " 과목은 캡슐을 봉인할 때 '헷갈리기 쉬운 부분'을 소리 내어 한 번 더 읽어보세요."
                : "매일 공부 후 3줄 정리로 1개 이상의 캡슐을 꾸준히 담아보세요.",
              "서술형이나 빈칸 문제를 풀 때는 핵심 용어 2개 이상을 꼭 문장에 포함해 답해보세요.",
              "오답이 나온 캡슐은 다음 날 바로 다시 열어서 1일 차 기억을 고정하는 것이 효과적입니다.",
            ],
          };
        }

        function requestAnalysis(subject, topic, lines) {
          if (!canUseServerApi()) {
            return Promise.resolve(localAnalyze(subject, topic, lines));
          }
          return postJsonWithTimeout("/api/analyze", { subject: subject, topic: topic, lines: lines }, 30000).catch(
            function (err) {
              if (err && (err.status === 404 || err.status === 405 || err.status === 501)) {
                return localAnalyze(subject, topic, lines);
              }
              throw err;
            }
          );
        }

        function requestQuiz(capsule) {
          if (!canUseServerApi()) {
            return Promise.resolve(localGenerateQuiz(capsule));
          }
          return postJsonWithTimeout("/api/quiz", { capsule: capsule }, 30000).catch(function (err) {
            if (err && (err.status === 404 || err.status === 405 || err.status === 501)) {
              return localGenerateQuiz(capsule);
            }
            throw err;
          });
        }

        function requestGrade(capsule, question, userAnswer) {
          if (!canUseServerApi()) {
            return Promise.resolve(localGradeAnswer(question, userAnswer));
          }
          return postJsonWithTimeout(
            "/api/grade",
            {
              subject: capsule.subject,
              topic: capsule.topic,
              question: question.question,
              answerKey: question.answerKey,
              questionType: question.type,
              userAnswer: userAnswer,
            },
            25000
          ).catch(function (err) {
            if (err && (err.status === 404 || err.status === 405 || err.status === 501)) {
              return localGradeAnswer(question, userAnswer);
            }
            throw err;
          });
        }

        function requestWeeklyReport(capsules, todayStr) {
          if (!canUseServerApi()) {
            return Promise.resolve(localWeeklyReport(capsules, todayStr));
          }
          var weekAgo = addDays(todayStr, -7);
          var recentHistory = [];
          capsules.forEach(function (c) {
            c.reviewHistory.forEach(function (h) {
              if (diffDays(weekAgo, h.date) >= 0) {
                recentHistory.push({
                  subject: c.subject,
                  topic: c.topic,
                  date: h.date,
                  questionType: h.questionType,
                  result: h.result,
                });
              }
            });
          });
          return postJsonWithTimeout(
            "/api/weekly-report",
            {
              totalCapsules: capsules.length,
              masteredCount: capsules.filter(function (c) {
                return c.isMastered;
              }).length,
              recentHistory: recentHistory,
            },
            30000
          ).catch(function (err) {
            if (err && (err.status === 404 || err.status === 405 || err.status === 501)) {
              return localWeeklyReport(capsules, todayStr);
            }
            throw err;
          });
        }

        /* -------------------- Download Helpers -------------------- */
        function triggerBlobDownload(content, filename, mimeType) {
          var blob = new Blob([content], { type: mimeType });
          var url = URL.createObjectURL(blob);
          var link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.style.display = "none";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 30000);
        }

        function downloadCleanIndexHtml() {
          if (canUseServerApi()) {
            fetch("/index.html", { cache: "no-store" })
              .then(function (res) {
                if (!res.ok) throw new Error("fetch failed");
                return res.text();
              })
              .then(function (html) {
                triggerBlobDownload(html, "index.html", "text/html;charset=utf-8");
                state.downloadNotice = {
                  type: "success",
                  message:
                    "index.html 단일 파일 다운로드를 시작했습니다. 자동 저장이 막히면 오른쪽 '새 창에서 받기'를 눌러주세요.",
                };
                render();
              })
              .catch(function () {
                fallbackSelfHtmlDownload();
              });
          } else {
            fallbackSelfHtmlDownload();
          }
        }

        function fallbackSelfHtmlDownload() {
          var clone = document.documentElement.cloneNode(true);
          var appEl = clone.querySelector("#app");
          if (appEl) appEl.innerHTML = "";
          var html = "<!doctype html>\n" + clone.outerHTML;
          triggerBlobDownload(html, "index.html", "text/html;charset=utf-8");
          state.downloadNotice = {
            type: "success",
            message: "index.html 단일 파일 다운로드를 시작했습니다. GitHub에 그대로 올려 Vercel에 배포할 수 있습니다.",
          };
          render();
        }

        /* -------------------- Quiz Flow -------------------- */
        function startQuiz(capsuleId) {
          var capsule = state.storage.capsules.find(function (c) {
            return c.id === capsuleId;
          });
          if (!capsule) return;

          state.reviewingCapsuleId = capsuleId;
          state.quizState = {
            loading: true,
            error: null,
            questions: [],
            currentIndex: 0,
            selectedOption: null,
            textAnswer: "",
            grading: false,
            gradeError: null,
            answers: [],
            finished: false,
            outcome: null,
            updatedCapsule: null,
          };
          render();

          requestQuiz(capsule)
            .then(function (data) {
              if (!state.quizState || state.reviewingCapsuleId !== capsuleId) return;
              state.quizState.loading = false;
              state.quizState.questions = Array.isArray(data.questions) ? data.questions : [];
              if (state.quizState.questions.length === 0) {
                state.quizState.error = "퀴즈 문항을 생성하지 못했습니다. 다시 시도해 주세요.";
              }
              render();
            })
            .catch(function (err) {
              if (!state.quizState || state.reviewingCapsuleId !== capsuleId) return;
              state.quizState.loading = false;
              state.quizState.error = err && err.message ? err.message : "퀴즈 생성 중 오류가 발생했습니다.";
              render();
            });
        }

        function submitCurrentQuestion() {
          var qs = state.quizState;
          if (!qs || qs.grading || qs.loading) return;
          var capsule = state.storage.capsules.find(function (c) {
            return c.id === state.reviewingCapsuleId;
          });
          if (!capsule) return;
          var q = qs.questions[qs.currentIndex];
          if (!q) return;

          if (q.type === "multiple_choice") {
            if (qs.selectedOption === null) {
              qs.gradeError = "보기를 하나 선택해 주세요.";
              render();
              return;
            }
            var chosen = (q.options || [])[qs.selectedOption] || "";
            var isCorrect = qs.selectedOption === q.correctOptionIndex;
            recordQuestionAnswer({
              question: q,
              userAnswer: chosen,
              result: isCorrect ? "correct" : "incorrect",
              feedback: isCorrect
                ? "정확합니다! " + (q.explanation || "")
                : "정답은 '" + ((q.options || [])[q.correctOptionIndex] || q.answerKey) + "'입니다. " + (q.explanation || ""),
            });
            return;
          }

          var textAns = (qs.textAnswer || "").trim();
          if (!textAns) {
            qs.gradeError = "답안을 입력해 주세요.";
            render();
            return;
          }

          qs.grading = true;
          qs.gradeError = null;
          render();

          requestGrade(capsule, q, textAns)
            .then(function (res) {
              if (!state.quizState) return;
              state.quizState.grading = false;
              recordQuestionAnswer({
                question: q,
                userAnswer: textAns,
                result: res.result || "partial",
                feedback: res.feedback || q.explanation || "",
              });
            })
            .catch(function (err) {
              if (!state.quizState) return;
              state.quizState.grading = false;
              state.quizState.gradeError = err && err.message ? err.message : "채점 중 오류가 발생했습니다.";
              render();
            });
        }

        function recordQuestionAnswer(entry) {
          var qs = state.quizState;
          if (!qs) return;
          qs.answers.push(entry);
          qs.gradeError = null;

          if (qs.currentIndex + 1 < qs.questions.length) {
            qs.currentIndex += 1;
            qs.selectedOption = null;
            qs.textAnswer = "";
            render();
            return;
          }

          // Finalize quiz outcome
          var correctCount = qs.answers.filter(function (a) {
            return a.result === "correct";
          }).length;
          var partialCount = qs.answers.filter(function (a) {
            return a.result === "partial";
          }).length;
          var total = qs.answers.length;

          var overall = "incorrect";
          if (correctCount === total || (total >= 2 && correctCount >= total - 1 && partialCount >= 1)) {
            overall = correctCount === total ? "correct" : "partial";
          } else if (correctCount > 0 || partialCount > 0) {
            overall = "partial";
          }

          var capsule = state.storage.capsules.find(function (c) {
            return c.id === state.reviewingCapsuleId;
          });
          if (!capsule) return;

          var todayStr = getVirtualToday(state.storage.demoDayOffset);
          var newHistory = qs.answers.map(function (a) {
            return {
              date: todayStr,
              questionType: a.question.type,
              question: a.question.question,
              userAnswer: a.userAnswer,
              result: a.result,
              aiFeedback: a.feedback,
            };
          });

          var updated = applyReviewOutcome(
            Object.assign({}, capsule, {
              reviewHistory: capsule.reviewHistory.concat(newHistory),
            }),
            todayStr,
            overall
          );

          commitStorage(
            Object.assign({}, state.storage, {
              capsules: state.storage.capsules.map(function (c) {
                return c.id === capsule.id ? updated : c;
              }),
            })
          );

          qs.finished = true;
          qs.outcome = overall;
          qs.updatedCapsule = updated;
          render();
        }

            if (state.archiveFilter === "due" && (c.isMastered || diffDays(c.nextReviewDate, todayStr) < 0)) return false;
            if (state.archiveSubject !== "전체" && c.subject !== state.archiveSubject) return false;
            if (state.archiveSearch.trim()) {
              var q = state.archiveSearch.trim().toLowerCase();
              var hay = (c.topic + " " + c.lines.join(" ")).toLowerCase();
              if (hay.indexOf(q) === -1) return false;

                capsules.filter(function (c) {

                }).length +
                ")",

            {
              id: "sealed",
              label:
                "봉인 중 (" +
                capsules.filter(function (c) {
                  return !c.isMastered;

                ")",
            },

              id: "mastered",

                      '<div class="field-label">내가 정리한 3줄</div>' +

        function renderReport(todayStr) {
          var capsules = state.storage.capsules;
          var weekAgo = addDays(todayStr, -7);
          var recent = [];
          var subjCounts = {};

          capsules.forEach(function (c) {
            c.reviewHistory.forEach(function (h) {
              if (diffDays(weekAgo, h.date) >= 0) {
                recent.push({ subject: c.subject, h: h });
                if (!subjCounts[c.subject]) subjCounts[c.subject] = { total: 0, correct: 0 };
                subjCounts[c.subject].total += 1;
                if (h.result === "correct") subjCounts[c.subject].correct += 1;
              }
            });
          });

          var totalReviews = recent.length;
          var correctReviews = recent.filter(function (r) {
            return r.h.result === "correct";
          }).length;
          var rate = totalReviews > 0 ? Math.round((correctReviews / totalReviews) * 100) : 0;

          var cached = state.storage.weeklyReport;
          var aiReportHtml = "";
          if (cached) {
            aiReportHtml =
              '<section class="card stack-md" style="border-color:rgba(43,76,126,0.3)">' +
              '<div class="row-between">' +
              '<h2 class="section-title">AI 학습 패턴 분석 리포트</h2>' +
              '<span class="small-text muted mono-num">' +
              escapeHtml(cached.generatedAt) +
              " 생성</span>" +

        function renderQuizModal() {
          var qs = state.quizState;
          if (!state.reviewingCapsuleId || !qs) return "";
          var capsule = state.storage.capsules.find(function (c) {
            return c.id === state.reviewingCapsuleId;
          });
          if (!capsule) return "";

          var body = "";
          if (qs.loading) {
            body =
              '<div class="empty-state">' +
              iconSvg("loader", 28) +
              '<p class="body-text" style="margin:0">AI가 맞춤형 복습 퀴즈를 출제하고 있습니다...</p>' +
              "</div>";
          } else if (qs.error) {
            body =
              '<div class="alert alert-error"><span>' +
              escapeHtml(qs.error) +
              '</span></div><div class="row-actions"><button type="button" class="btn btn-primary" data-action="retry-quiz">다시 시도</button><button type="button" class="btn btn-outline" data-action="close-quiz">닫기</button></div>';
          } else if (qs.finished) {
            var nextInfo = qs.updatedCapsule.isMastered
              ? "장기 기억 완료 단계에 도달했습니다!"
              : "다음 복습 예정일: " + qs.updatedCapsule.nextReviewDate + " (" + STAGE_LABELS[qs.updatedCapsule.stage] + ")";

            body =
              '<div class="stack-md">' +
              '<div class="alert ' +
              (qs.outcome === "correct" ? "alert-success" : qs.outcome === "partial" ? "alert-warn" : "alert-error") +
              '"><div><strong>이번 복습 결과: ' +
              escapeHtml(RESULT_LABELS[qs.outcome]) +
              '</strong><div style="margin-top:4px">' +
              escapeHtml(nextInfo) +
              "</div></div></div>" +
              '<div class="stack-sm">' +
              qs.answers
                .map(function (a, idx) {
                  return (
                    '<div class="card-subtle stack-sm">' +
                    '<div class="row-between small-text"><strong>문제 ' +
                    (idx + 1) +
                    " · " +
                    escapeHtml(QUESTION_TYPE_LABELS[a.question.type] || a.question.type) +
                    '</strong><strong style="color:' +
                    (a.result === "correct"
                      ? "var(--accent-green)"
                      : a.result === "partial"
                      ? "var(--accent-amber-text)"
                      : "var(--accent-red)") +
                    '">' +
                    escapeHtml(RESULT_LABELS[a.result]) +
                    "</strong></div>" +
                    '<div class="body-text">' +
                    escapeHtml(a.question.question) +
                    "</div>" +
                    '<div class="small-text muted">내 답: ' +
                    escapeHtml(a.userAnswer) +
                    "</div>" +
                    '<div class="small-text" style="color:var(--accent-navy)">피드백: ' +
                    escapeHtml(a.feedback) +
                    "</div>" +
                    "</div>"
                  );
                })
                .join("") +
              "</div>" +
              '<button type="button" class="btn btn-primary full-width" data-action="close-quiz">확인하고 돌아가기</button>' +
              "</div>";
          } else {
            var q = qs.questions[qs.currentIndex];
            var inputArea = "";
            if (q.type === "multiple_choice") {
              inputArea =
                '<div class="stack-sm">' +
                (q.options || [])
                  .map(function (opt, idx) {
                    return (
                      '<button type="button" class="choice-option ' +
                      (qs.selectedOption === idx ? "selected" : "") +
                      '" data-action="select-quiz-option" data-idx="' +
                      idx +
                      '">' +
                      '<span class="mono-num" style="font-weight:700">' +
                      (idx + 1) +
                      ".</span><span>" +
                      escapeHtml(opt) +
                      "</span></button>"
                    );
                  })
                  .join("") +
                "</div>";
            } else {
              inputArea =
                '<textarea id="quiz-text-answer" class="textarea" placeholder="' +
                (q.type === "fill_blank" ? "빈칸에 들어갈 핵심 용어를 입력하세요" : "핵심 의미가 드러나게 한 줄로 적어보세요") +
                '" data-bind="quiz-text">' +
                escapeHtml(qs.textAnswer) +
                "</textarea>";
            }

            body =
              '<div class="stack-md">' +
              '<div class="row-between small-text muted">' +
              "<span>" +
              escapeHtml(QUESTION_TYPE_LABELS[q.type] || q.type) +
              "</span>" +
              '<span class="mono-num">' +
              (qs.currentIndex + 1) +
              " / " +
              qs.questions.length +
              "</span>" +
              "</div>" +
              '<p style="margin:0;font-size:16px;font-weight:600;white-space:pre-line">' +
              escapeHtml(q.question) +
              "</p>" +
              inputArea +
              (qs.gradeError ? '<div class="alert alert-error"><span>' + escapeHtml(qs.gradeError) + "</span></div>" : "") +
              '<button type="button" class="btn btn-primary full-width" ' +
              (qs.grading ? "disabled" : "") +
              ' data-action="submit-quiz-answer">' +
              (qs.grading ? iconSvg("loader", 16) : iconSvg("check", 16)) +
              "<span>" +
              (qs.grading
                ? "AI가 답안을 채점하는 중..."
                : qs.currentIndex + 1 < qs.questions.length
                ? "답안 제출하고 다음 문제로"
                : "제출하고 복습 결과 보기") +
              "</span></button>" +
              "</div>";
          }

          return (
            '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
            '<div class="modal-panel">' +
            '<div class="row-between" style="padding-bottom:12px;border-bottom:1px solid var(--border-color)">' +
            '<div><div class="small-text subject-label">' +
            escapeHtml(capsule.subject) +
            '</div><h2 class="section-title" style="margin-top:2px">' +
            escapeHtml(capsule.topic) +
            "</h2></div>" +
            '<button type="button" class="icon-btn" data-action="close-quiz" aria-label="닫기">' +
            iconSvg("x", 16) +
            "</button>" +
            "</div>" +
            body +
            "</div>" +
            "</div>"
          );
        }

        function renderMobileNav(dueCount) {
          var tabs = [
            { id: "home", label: "홈" + (dueCount > 0 ? " (" + dueCount + ")" : ""), icon: "home" },
            { id: "create", label: "담기", icon: "plus" },
            { id: "archive", label: "보관함", icon: "archive" },
            { id: "report", label: "리포트", icon: "chart" },
          ];
          return (
            '<nav class="mobile-nav" aria-label="모바일 하단 메뉴">' +
            tabs
              .map(function (t) {
                return (
                  '<button type="button" class="mobile-nav-btn ' +
                  (state.activeTab === t.id ? "active" : "") +
                  '" data-action="go-tab" data-tab="' +
                  t.id +
                  '">' +
                  iconSvg(t.icon, 20) +
                  "<span>" +
                  escapeHtml(t.label) +
                  "</span></button>"
                );
              })
              .join("") +
            "</nav>"
          );
        }

        function render() {
          var appEl = document.getElementById("app");
          if (!appEl) return;

          var todayStr = getVirtualToday(state.storage.demoDayOffset);
          var dueCount = getSortedDueCapsules(state.storage.capsules, todayStr).length;

          var demoBanner =
            state.storage.demoDayOffset !== 0
              ? '<div class="demo-banner">시연용 날짜 이동 적용 중 · 현재 기준일 <strong class="mono-num">' +
                escapeHtml(formatKoreanDate(todayStr)) +
                "</strong> (+" +
                state.storage.demoDayOffset +
                '일)<button type="button" class="demo-reset-link" data-action="reset-demo-date">원래 날짜로</button></div>'
              : "";

          var pageHtml = "";
          if (state.activeTab === "home") pageHtml = renderHome(todayStr);
          else if (state.activeTab === "create") pageHtml = renderCreate(todayStr);
          else if (state.activeTab === "archive") pageHtml = renderArchive(todayStr);
          else if (state.activeTab === "report") pageHtml = renderReport(todayStr);
          else if (state.activeTab === "settings") pageHtml = renderSettings(todayStr);

          appEl.innerHTML =
            renderHeader(dueCount) +
            renderDownloadBanner() +
            demoBanner +
            '<main class="main-content">' +
            pageHtml +
            "</main>" +
            renderMobileNav(dueCount) +
            renderQuizModal();
        }

        /* -------------------- Event Delegation -------------------- */
        document.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-action]");
          if (!btn) return;
          var action = btn.getAttribute("data-action");
          var todayStr = getVirtualToday(state.storage.demoDayOffset);

          if (action === "go-tab") {
            state.activeTab = btn.getAttribute("data-tab") || "home";
            render();
          } else if (action === "download-html") {
            downloadCleanIndexHtml();
          } else if (action === "close-download-banner") {
            state.downloadNotice = null;
            render();
          } else if (action === "select-create-subject") {
            state.createSubject = btn.getAttribute("data-subject") || "정보";
            render();
          } else if (action === "analyze-capsule") {
            if (state.createLoading) return;
            var topic = state.createTopic.trim();
            var lines = state.createLines.map(function (l) {
              return l.trim();
            });
            if (!topic) {
              state.createError = "단원 또는 주제 제목을 입력해 주세요.";
              render();
              return;
            }
            if (!lines[0] || !lines[1] || !lines[2] || lines.join("").length < 10) {
              state.createError = "오늘 배운 내용 3줄을 모두 조금 더 자세히 작성해 주세요. (총 10자 이상)";
              render();
              return;
            }
            state.createLoading = true;
            state.createError = null;
            render();

            requestAnalysis(state.createSubject, topic, lines)
              .then(function (result) {
                state.createLoading = false;
                state.createAnalysis = result;
                render();
              })
              .catch(function (err) {
                state.createLoading = false;
                state.createError = err && err.message ? err.message : "AI 분석을 완료하지 못했습니다.";
                render();
              });
          } else if (action === "seal-capsule") {
            if (!state.createAnalysis) return;
            var newCapsule = {
              id: "cap_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
              subject: state.createSubject,
              topic: state.createTopic.trim(),
              lines: state.createLines.map(function (l) {
                return l.trim();
              }),
              aiAnalysis: state.createAnalysis,
              stage: 0,
              nextReviewDate: addDays(todayStr, 1),
              isMastered: false,
              createdAt: todayStr,
              reviewHistory: [],
            };
            commitStorage(
              Object.assign({}, state.storage, {
                capsules: [newCapsule].concat(state.storage.capsules),
              })
            );
            state.createTopic = "";
            state.createLines = ["", "", ""];
            state.createAnalysis = null;
            state.createError = null;
            state.activeTab = "home";
            render();
          } else if (action === "open-quiz") {
            startQuiz(btn.getAttribute("data-id"));
          } else if (action === "retry-quiz") {
            if (state.reviewingCapsuleId) startQuiz(state.reviewingCapsuleId);
          } else if (action === "close-quiz") {
            state.reviewingCapsuleId = null;
            state.quizState = null;
            render();
          } else if (action === "select-quiz-option") {
            if (state.quizState) {
              state.quizState.selectedOption = Number(btn.getAttribute("data-idx"));
              state.quizState.gradeError = null;
              render();
            }
          } else if (action === "submit-quiz-answer") {
            submitCurrentQuestion();
          } else if (action === "set-archive-filter") {
            state.archiveFilter = btn.getAttribute("data-filter") || "all";
            render();
          } else if (action === "toggle-expand") {
            var id = btn.getAttribute("data-id");
            state.expandedCapsuleIds[id] = !state.expandedCapsuleIds[id];
            render();
          } else if (action === "ask-delete") {
            state.confirmDeleteId = btn.getAttribute("data-id");
            render();
          } else if (action === "cancel-delete") {
            state.confirmDeleteId = null;
            render();
          } else if (action === "confirm-delete") {
            var delId = btn.getAttribute("data-id");
            commitStorage(
              Object.assign({}, state.storage, {
                capsules: state.storage.capsules.filter(function (c) {
                  return c.id !== delId;
                }),
              })
            );
            state.confirmDeleteId = null;
            render();
          } else if (action === "generate-report") {
            if (state.reportLoading) return;
            state.reportLoading = true;
            state.reportError = null;
            render();

            requestWeeklyReport(state.storage.capsules, todayStr)
              .then(function (rep) {
                state.reportLoading = false;
                commitStorage(
                  Object.assign({}, state.storage, {
                    weeklyReport: Object.assign({}, rep, { generatedAt: todayStr }),
                  })
                );
                render();
              })
              .catch(function (err) {
                state.reportLoading = false;
                state.reportError = err && err.message ? err.message : "리포트 생성 중 오류가 발생했습니다.";
                render();
              });
          } else if (action === "shift-days") {
            var delta = Number(btn.getAttribute("data-days")) || 0;
            commitStorage(
              Object.assign({}, state.storage, {
                demoDayOffset: state.storage.demoDayOffset + delta,
              })
            );
            state.settingsNotice = {
              type: "success",
              text: "기준 날짜를 +" + delta + "일 앞당겼습니다. 홈에서 오늘 열릴 캡슐을 확인하세요.",
            };
            render();
          } else if (action === "reset-demo-date") {
            commitStorage(Object.assign({}, state.storage, { demoDayOffset: 0 }));
            state.settingsNotice = { type: "success", text: "기준 날짜를 실제 오늘로 되돌렸습니다." };
            render();
          } else if (action === "load-sample") {
            commitStorage({
              capsules: createSampleCapsules(getTodayStr()),
              weeklyReport: null,
              demoDayOffset: 0,
            });
            state.confirmResetAll = false;
            state.settingsNotice = {
              type: "success",
              text: "고1 과목별 샘플 캡슐 6개를 불러왔습니다.",
            };
            render();
          } else if (action === "ask-reset-all") {
            state.confirmResetAll = true;
            render();
          } else if (action === "cancel-reset-all") {
            state.confirmResetAll = false;
            render();
          } else if (action === "confirm-reset-all") {
            commitStorage(defaultStorage());
            state.confirmResetAll = false;
            state.settingsNotice = { type: "success", text: "모든 데이터를 초기화했습니다." };
            render();
          } else if (action === "export-json") {
            triggerBlobDownload(
              JSON.stringify(state.storage, null, 2),
              "망각타임캡슐_백업_" + todayStr + ".json",
              "application/json;charset=utf-8"
            );
            state.settingsNotice = { type: "success", text: "JSON 백업 파일을 내려받았습니다." };
            render();
          } else if (action === "trigger-import-json") {
            var fileEl = document.getElementById("import-json-input");
            if (fileEl) fileEl.click();
          }
        });

        document.addEventListener("input", function (e) {
          var el = e.target;
          var bind = el.getAttribute && el.getAttribute("data-bind");
          if (!bind) return;
          if (bind === "create-topic") {
            state.createTopic = el.value;
          } else if (bind === "create-line") {
            var idx = Number(el.getAttribute("data-idx"));
            state.createLines[idx] = el.value;
          } else if (bind === "archive-search") {
            state.archiveSearch = el.value;
            render();
            var searchInput = document.querySelector('[data-bind="archive-search"]');
            if (searchInput) {
              searchInput.focus();
              searchInput.setSelectionRange(state.archiveSearch.length, state.archiveSearch.length);
            }
          } else if (bind === "quiz-text") {
            if (state.quizState) state.quizState.textAnswer = el.value;
          }
        });

        document.addEventListener("change", function (e) {
          var el = e.target;
          if (el.getAttribute && el.getAttribute("data-bind") === "archive-subject") {
            state.archiveSubject = el.value;
            render();
            return;
          }
          if (el.id === "import-json-input") {
            var file = el.files && el.files[0];
            if (!file) return;
            file
              .text()
              .then(function (raw) {
                var parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.capsules)) {
                  throw new Error("올바른 망각 타임캡슐 백업 파일이 아닙니다.");
                }
                commitStorage({
                  capsules: parsed.capsules,
                  weeklyReport: parsed.weeklyReport || null,
                  demoDayOffset: typeof parsed.demoDayOffset === "number" ? parsed.demoDayOffset : 0,
                });
                state.settingsNotice = {
                  type: "success",
                  text: "백업 파일에서 캡슐 " + parsed.capsules.length + "개를 불러왔습니다.",
                };
                render();
              })
              .catch(function (err) {
                state.settingsNotice = {
                  type: "error",
                  text: err && err.message ? err.message : "JSON 파일을 읽는 중 오류가 발생했습니다.",
                };
                render();
              });
          }
        });

        render();
      })();
    </script>
  </body>
</html>
